name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Demos
        run: |
          go run ./cmd/hashdemo >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/filterdemo >> "$GITHUB_STEP_SUMMARY"
