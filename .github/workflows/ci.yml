name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lab -d lab"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Demos
        run: |
          go run ./cmd/hashdemo >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/filterdemo >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/timerdemo >> "$GITHUB_STEP_SUMMARY"
          DATABASE_URL=postgres://lab:lab@localhost:5432/lab?sslmode=disable go run ./cmd/dbqueue -jobs 20000 -spread 5s >> "$GITHUB_STEP_SUMMARY"
